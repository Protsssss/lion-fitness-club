<!DOCTYPE html>
<html lang="ua">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Реєстрація — Lion Sport Club</title>
  <link rel="stylesheet" href="/cyber-platform/public/css/login_style.css">
</head>
<body>

<div class="auth-wrap">

  <div class="auth-brand">
    <div class="brand-lines">
      <span></span><span></span><span></span><span></span>
    </div>

    <div class="brand-badge">
      <div class="brand-badge-icon">L</div>
      <div class="brand-badge-name">LION CLUB</div>
    </div>

    <div class="brand-content">
      <p class="brand-eyebrow">Приєднуйся до нас</p>
      <h1 class="brand-title">СТАНЬ<br><em>ЧАСТИНОЮ</em><br>ПРАЙДУ.</h1>
      <p class="brand-desc">
        Створи акаунт, щоб отримати повний контроль над своїм тренувальним процесом. Твій результат починається тут.
      </p>
      <div class="brand-stats">
        <div class="stat-item">
          <strong>100+</strong>
          <span>Тренажерів</span>
        </div>
        <div class="stat-item">
          <strong>PRO</strong>
          <span>Тренери</span>
        </div>
      </div>
    </div>
  </div>

  <div class="auth-form-panel">
    <div class="auth-form-box">

      <p class="form-eyebrow">Новий акаунт</p>
      <h2 class="form-title">РЕЄСТРАЦІЯ</h2>

      <div class="field">
        <label for="username">Логін</label>
        <input type="text" id="username" placeholder="Придумай логін" autocomplete="username" />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Твій робочий email" autocomplete="email" />
      </div>

      <div class="field">
        <label for="password">Пароль</label>
        <input type="password" id="password" placeholder="Мінімум 8 символів" autocomplete="new-password" />
      </div>

      <p id="error-msg"></p>
      <p id="success-msg" style="color: #4ade80; font-size: 13px; margin-bottom: 8px;"></p>

      <button class="btn-primary" id="registerBtn" onclick="doRegister()">СТВОРИТИ АКАУНТ</button>

      <div class="form-divider">або</div>

      <button class="btn-ghost" onclick="window.location.href='/cyber-platform/'">
        ← На головну сторінку
      </button>

      <p class="form-footer">
        Вже маєте акаунт?&nbsp;
        <a href="/cyber-platform/login">Увійти</a>
      </p>

    </div>
  </div>

</div>

<script>
// Вхід по Enter, як і на сторінці логіну
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') doRegister();
});

async function doRegister() {
  const username = document.getElementById('username').value.trim();
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('registerBtn');
  const errEl    = document.getElementById('error-msg');
  const succEl   = document.getElementById('success-msg');

  // Очищаємо старі повідомлення
  errEl.textContent = '';
  succEl.textContent = '';

  if (!username || !email || !password) {
    errEl.textContent = 'Заповніть усі поля';
    return;
  }

  if (!email.includes('@')) {
    errEl.textContent = 'Введіть коректний email';
    return;
  }

  // Анімація завантаження на кнопці
  btn.classList.add('loading');
  btn.textContent = '';

  try {
    const response = await fetch('/cyber-platform/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password })
    });

    const result = await response.json();

    btn.classList.remove('loading');
    btn.textContent = 'СТВОРИТИ АКАУНТ';

    if (result.success) {
      succEl.textContent = 'Успішно! Переходимо до входу...';
      setTimeout(() => window.location.href = '/cyber-platform/login', 1500);
    } else {
      errEl.textContent = result.message || 'Помилка реєстрації';
    }
  } catch (e) {
    btn.classList.remove('loading');
    btn.textContent = 'СТВОРИТИ АКАУНТ';
    errEl.textContent = 'Помилка з\'єднання з сервером';
  }
}
</script>

</body>
</html>
