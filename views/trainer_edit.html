<!DOCTYPE html>
<html lang="ua">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель тренера — Lion</title>
    <link rel="stylesheet" href="/cyber-platform/public/css/dashboard_style.css">
</head>
<body>

<div class="dashboard-container">
    <h1>ПАНЕЛЬ ТРЕНЕРА <span class="badge" style="background: #e67e22; color: #fff;">РОЗШИРЕНИЙ ДОСТУП</span></h1>
    <div id="loading" style="color: var(--lion); font-weight: 500;">Завантаження...</div>

    <div id="content" style="display:none;">

        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('clients', this)">👥 Мої клієнти</button>
            <button class="tab-btn" onclick="showTab('contacts', this)">📩 Контакти</button>
            <button class="tab-btn" onclick="showTab('purchases', this)">🛒 Покупки (магазин)</button>
            <button class="tab-btn" onclick="showTab('subscriptions', this)">🧧 Абонементи</button>
        </div>

        <div id="tab-clients" class="tab-content active">
            <div id="trainer-profile" style="margin-bottom: 24px; color: var(--muted); font-size: 14px;"></div>
            <table>
                <thead>
                    <tr>
                        <th>Ім'я</th><th>Email</th><th>Зріст</th><th>Вага</th><th>Абонемент</th>
                    </tr>
                </thead>
                <tbody id="clients-body"></tbody>
            </table>
        </div>

        <div id="tab-contacts" class="tab-content">
            <table>
                <thead>
                    <tr>
                        <th>ID</th><th>Ім'я</th><th>Телефон</th>
                        <th>Email</th><th>Тема</th><th>Повідомлення</th>
                    </tr>
                </thead>
                <tbody id="contacts-body"></tbody>
            </table>
        </div>

        <div id="tab-purchases" class="tab-content">
            <table>
                <thead>
                    <tr>
                        <th>ID</th><th>Товар</th><th>Покупець</th>
                        <th>Телефон</th><th>Доставка</th><th>К-сть</th><th>Сума</th>
                    </tr>
                </thead>
                <tbody id="purchases-body"></tbody>
            </table>
        </div>

        <div id="tab-subscriptions" class="tab-content">
            <table>
                <thead>
                    <tr>
                        <th>ID</th><th>Абонемент</th><th>Ім'я</th>
                        <th>Email</th><th>Телефон</th><th>Додатково</th>
                    </tr>
                </thead>
                <tbody id="subscriptions-body"></tbody>
            </table>
        </div>

    </div>

    <div id="error" style="display:none; color:#e74c3c; margin-top:20px; font-weight: 500;">
        Доступ заборонено. <a href="/cyber-platform/login" style="color: var(--lion);">Увійти</a>
    </div>

    <div class="bottom-actions">
        <button class="btn-logout" onclick="doLogout()">Вийти з акаунта</button>
        <button class="btn-home" onclick="window.location.href='/cyber-platform/'">На головну сторінку</button>
    </div>
</div>

<script>
function showTab(name, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    btn.classList.add('active');
}

async function loadAll() {
    const r1 = await fetch('/cyber-platform/api/trainer/clients');
    const d1 = await r1.json();
    document.getElementById('loading').style.display = 'none';

    if (!d1.success) {
        document.getElementById('error').style.display = 'block';
        return;
    }
    document.getElementById('content').style.display = 'block';

    const t = d1.trainer;
    document.getElementById('trainer-profile').innerHTML = `
        <p><strong>Ім'я:</strong> ${t.full_name||'—'} &nbsp;|&nbsp;
           <strong>Email:</strong> ${t.email||'—'} &nbsp;|&nbsp;
           <strong>Тип:</strong> <span class="badge" style="background:var(--dark3); color:var(--text); border: 1px solid var(--dark4);">${t.trainer_type||'—'}</span></p>`;

    const tbody1 = document.getElementById('clients-body');
    if (d1.clients.length === 0) {
        tbody1.innerHTML = '<tr><td colspan="5" style="text-align:center; color: var(--muted);">Клієнтів поки немає</td></tr>';
    } else {
        d1.clients.forEach(c => {
            tbody1.innerHTML += `
                <tr>
                    <td>${c.full_name||'—'}</td><td>${c.email||'—'}</td>
                    <td>${c.height||'—'}</td><td>${c.weight||'—'}</td>
                    <td>${c.subscription||'—'}</td>
                </tr>`;
        });
    }

    const r2 = await fetch('/cyber-platform/api/contact/all');
    const d2 = await r2.json();
    if (d2.success) {
        const tbody2 = document.getElementById('contacts-body');
        if (d2.requests.length === 0) {
            tbody2.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--muted);">Запитів немає</td></tr>';
        } else {
            d2.requests.forEach(c => {
                tbody2.innerHTML += `
                    <tr>
                        <td>${c.id}</td><td>${c.name}</td><td>${c.telephone}</td>
                        <td>${c.email}</td><td>${c.subject||'—'}</td><td>${c.message}</td>
                    </tr>`;
            });
        }
    }

    const r3 = await fetch('/cyber-platform/api/shop/purchases');
    const d3 = await r3.json();
    if (d3.success) {
        const tbody3 = document.getElementById('purchases-body');
        if (d3.purchases.length === 0) {
            tbody3.innerHTML = '<tr><td colspan="7" style="text-align:center; color: var(--muted);">Покупок немає</td></tr>';
        } else {
            d3.purchases.forEach(p => {
                tbody3.innerHTML += `
                    <tr>
                        <td>${p.id}</td><td>${p.product_name}</td><td>${p.name}</td>
                        <td>${p.phone}</td><td>${p.delivery}</td>
                        <td>${p.quantity}</td><td style="color:var(--lion); font-weight:bold;">${p.total_price} ₴</td>
                    </tr>`;
            });
        }
    }

    const r4 = await fetch('/cyber-platform/api/subscription/all');
    const d4 = await r4.json();
    if (d4.success) {
        const tbody4 = document.getElementById('subscriptions-body');
        if (d4.subscriptions.length === 0) {
            tbody4.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--muted);">Запитів немає</td></tr>';
        } else {
            d4.subscriptions.forEach(s => {
                tbody4.innerHTML += `
                    <tr>
                        <td>${s.id}</td><td>${s.abonement_type||'—'}</td><td>${s.name}</td>
                        <td>${s.email||'—'}</td><td>${s.phone}</td>
                        <td>${s.additional_info||'—'}</td>
                    </tr>`;
            });
        }
    }
}

async function doLogout() {
    await fetch('/cyber-platform/api/logout', { method: 'POST' });
    window.location.href = '/cyber-platform/login';
}

loadAll();
</script>

</body>
</html>
